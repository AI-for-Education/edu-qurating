[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qurating", "src/qurating/prompting/templates/*.txt"]

[tool.uv.sources]
fabdata-llm = { git = "https://github.com/AI-for-Education/fabdata-llm.git", rev = "gemini-logprobs" }
# torch = {index = "pytorch"}
# torchvision = {index = "pytorch"}

[project]
name = "fab-qurating"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "anthropic>=0.49.0",
    # "fabdata-llm==0.29.0",
    "joblib>=1.5.1",
    "matplotlib>=3.10.5",
    "peft>=0.17.1",
    "pydantic>=2.11.7",
    "openai>=1.61.1",
    "torch>=2.6.0",
    "torchvision",
    "transformers>=4.56.2",
    "numpy>=2",
    "accelerate>=1.10.1",
    "tqdm>=4.66.5",
    "datasets>=4.1.1",
    "wandb>=0.22.1",
    "tiktoken>=0.12.0",
    "huggingface-hub[cli]>=0.35.1",
    "seaborn>=0.13.2",
    "pandas-gbq",
    "cloudpathlib[s3,gs,azure]>=0.23.0",
    "pymupdf==1.26.6",
    "pymupdf4llm>=0.2.9",
    "langdetect>=1.0.9",
    "lingua-language-detector>=2.1.1",
    "openpyxl>=3.1.5",
    "scipy>=1.17.0",
    "py-readability-metrics>=1.4.5",
    "pymupdf-layout>=1.26.6",
    "python-digitalocean>=1.17.0",
    "fabric>=3.2.2",
    "typer>=0.19.2",
    "tenacity>=9.1.2",
    "jsonlines>=4.0.0",
]


[dependency-groups]
dev = [
    "dvc>=3.61.0",
    "dvc-azure>=3.1.0",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
]
linux-gpu = [
    "flash-attn>=2.8.3; sys_platform=='linux'",
]
rl = [
    "unsloth>=2026.4.4",
    "vllm>=0.10.2",
]


# [tool.uv.extra-build-dependencies]
# flash-attn = ["torch"]

[tool.uv]
no-build-isolation-package = ['flash-attn']

