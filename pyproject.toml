[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qurating"]

[project]
name = "fab-qurating"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "anthropic>=0.60.0",
    "datasets>=4.0.0",
    "joblib>=1.5.1",
    "numpy>=2.3.2",
    "openai>=1.97.1",
    "tiktoken>=0.9.0",
    "tqdm>=4.67.1",
    "transformers>=4.54.0",
]

[dependency-groups]
dev = [
    "dvc>=3.61.0",
    "dvc-azure>=3.1.0",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
]
