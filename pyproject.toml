[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qurating", "src/qurating/prompting/templates/*.txt"]

[tool.uv.sources]
fabdata-llm = { git = "https://github.com/AI-for-Education/fabdata-llm.git", rev = "v0.29.0" }
# torch = {index = "pytorch"}
# torchvision = {index = "pytorch"}

[project]
name = "fab-qurating"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "anthropic>=0.49.0",
    "fabdata-llm==0.29.0",
    "joblib>=1.5.1",
    "matplotlib>=3.10.5",
    "peft>=0.17.1",
    "pydantic>=2.11.7",
    "openai>=1.61.1",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "transformers>=4.56.2",
    "numpy>=2.1.2",
    "accelerate>=1.10.1",
    "tqdm>=4.66.5",
    "datasets>=4.1.1",
    "wandb>=0.22.1",
    "tiktoken>=0.12.0",
]


[dependency-groups]
dev = [
    "dvc>=3.61.0",
    "dvc-azure>=3.1.0",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
]
linux-gpu = [
    "flash-attn>=2.8.3; sys_platform=='linux'",
]


